<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Bird</title>
<style>html,body{margin:0;height:100%;background:#4ec0ca;overflow:hidden;display:flex;justify-content:center;align-items:center}
canvas{height:100vh;max-width:100vw;touch-action:none;display:block}</style></head><body>
<canvas id="c" width="360" height="640"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=360,H=640,GR=H-80,G=0.45,J=-7.5,GAP=160,PW=52,BX=90,R=14;
let b,pipes,score,best=0,state,overT,last=performance.now();
try{best=+localStorage.getItem('best')||0}catch(e){}
function reset(){b={y:H/2,v:0};pipes=[];score=0;state='ready';overT=0}
function flap(){
  if(state==='over'){if(overT>25)reset();return}
  if(state==='ready')state='play';
  b.v=J;
}
function die(){
  state='over';overT=0;
  if(score>best){best=score;try{localStorage.setItem('best',best)}catch(e){}}
}
function update(d){
  if(state==='ready'){b.y=H/2+Math.sin(performance.now()/200)*8;return}
  if(state==='over'){overT+=d;if(b.y+R<GR){b.v+=G*d;b.y+=b.v*d}return}
  b.v+=G*d;b.y+=b.v*d;
  const lp=pipes[pipes.length-1];
  if(!lp||lp.x<W-200)pipes.push({x:W,top:60+Math.random()*(GR-GAP-120),s:false});
  for(const p of pipes){
    p.x-=2.6*d;
    if(!p.s&&p.x+PW<BX-R){p.s=true;score++}
    if(BX+R>p.x&&BX-R<p.x+PW&&(b.y-R<p.top||b.y+R>p.top+GAP))die();
  }
  pipes=pipes.filter(p=>p.x>-PW);
  if(b.y+R>GR||b.y-R<0){b.y=Math.min(Math.max(b.y,R),GR-R);die()}
}
function text(t,y,s,col){x.font='bold '+s+'px sans-serif';x.textAlign='center';x.lineWidth=5;x.strokeStyle='#222';x.strokeText(t,W/2,y);x.fillStyle=col||'#fff';x.fillText(t,W/2,y)}
function draw(){
  const g=x.createLinearGradient(0,0,0,GR);g.addColorStop(0,'#4ec0ca');g.addColorStop(1,'#bfe9ee');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const p of pipes){
    x.fillStyle='#5cb85c';x.strokeStyle='#2d6a2d';x.lineWidth=3;
    x.fillRect(p.x,0,PW,p.top);x.strokeRect(p.x,-2,PW,p.top+2);
    x.fillRect(p.x,p.top+GAP,PW,GR-p.top-GAP);x.strokeRect(p.x,p.top+GAP,PW,GR-p.top-GAP);
    x.fillRect(p.x-4,p.top-20,PW+8,20);x.strokeRect(p.x-4,p.top-20,PW+8,20);
    x.fillRect(p.x-4,p.top+GAP,PW+8,20);x.strokeRect(p.x-4,p.top+GAP,PW+8,20);
  }
  x.fillStyle='#ded895';x.fillRect(0,GR,W,80);x.fillStyle='#73bf2e';x.fillRect(0,GR,W,12);
  x.save();x.translate(BX,b.y);x.rotate(Math.max(-0.5,Math.min(1.2,b.v*0.07)));
  x.fillStyle='#f7d51d';x.beginPath();x.arc(0,0,R,0,7);x.fill();x.strokeStyle='#222';x.lineWidth=2;x.stroke();
  x.fillStyle='#fff';x.beginPath();x.arc(5,-4,5,0,7);x.fill();x.fillStyle='#222';x.beginPath();x.arc(7,-4,2,0,7);x.fill();
  x.fillStyle='#f08a1c';x.fillRect(8,2,12,6);
  x.restore();
  if(state==='ready'){text('Toca para volar',H/2-70,26);text('Mejor: '+best,H/2-35,18)}
  else text(score,70,48);
  if(state==='over'){text('Fin del juego',H/2-30,32);text('Puntos: '+score+'   Mejor: '+best,H/2+10,18);if(overT>25)text('Toca para reiniciar',H/2+50,18)}
}
function loop(t){const d=Math.min((t-last)/16.67,3);last=t;update(d);draw();requestAnimationFrame(loop)}
document.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});
reset();requestAnimationFrame(loop);
</script></body></html>
